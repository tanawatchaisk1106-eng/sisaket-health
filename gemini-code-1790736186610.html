<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบประเมินคัดกรองสุขภาพและพฤติกรรม 3อ. 2ส.</title>
    <style>
        body { font-family: 'Sarabun', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #219150; }
    </style>
</head>
<body>

<div class="container">
    <h2>แบบประเมินสุขภาพและพฤติกรรม 3อ. 2ส.</h2>
    <form id="healthForm">
        <div class="form-group">
            <label for="fullName">ชื่อ - นามสกุล:</label>
            <input type="text" id="fullName" required>
        </div>
        <div class="form-group">
            <label for="age">อายุ (ปี):</label>
            <input type="number" id="age" required>
        </div>
        <div class="form-group">
            <label for="gender">เพศ:</label>
            <select id="gender" required>
                <option value="">-- เลือกเพศ --</option>
                <option value="ชาย">ชาย</option>
                <option value="หญิง">หญิง</option>
            </select>
        </div>
        <div class="form-group">
            <label for="nutrition">อาหาร (3อ.): พฤติกรรมการรับประทานอาหารหวาน มัน เค็ม</label>
            <select id="nutrition" required>
                <option value="ดีมาก">รับประทานรสจืด/ผักผลไม้สม่ำเสมอ</option>
                <option value="ปานกลาง">รับประทานอาหารทั่วไป</option>
                <option value="ควรปรับปรุง">ติดหวาน/เค็ม/อาหารแปรรูปประจำ</option>
            </select>
        </div>
        <div class="form-group">
            <label for="exercise">ออกกำลังกาย (3อ.): กิจกรรมทางกายสัปดาห์ละอย่างน้อย 150 นาที</label>
            <select id="exercise" required>
                <option value="สม่ำเสมอ">ปฏิบัติสม่ำเสมอ</option>
                <option value="นานๆ ครั้ง">ปฏิบัตินานๆ ครั้ง</option>
                <option value="ไม่ได้ออกกำลังกาย">ไม่ได้ออกกำลังกาย</option>
            </select>
        </div>
        <div class="form-group">
            <label for="emotion">อารมณ์ (3อ.): การจัดการความเครียดและการนอนหลับ</label>
            <select id="emotion" required>
                <option value="ดี">นอนหลับพักผ่อนเพียงพอ/ผ่อนคลายได้ดี</option>
                <option value="ปานกลาง">มีความเครียดบางครั้ง</option>
                <option value="เครียดมาก">เครียดสะสม/นอนไม่หลับ</option>
            </select>
        </div>
        <div class="form-group">
            <label for="smoking_alcohol">สุรา/บุหรี่ (2ส.): การดื่มสุราและการสูบบุหรี่</label>
            <select id="smoking_alcohol" required>
                <option value="ไม่สูบ/ไม่ดื่ม">ไม่สูบบุหรี่ และ ไม่ดื่มสุรา</option>
                <option value="ดื่ม/สูบบางครั้ง">ดื่มสุราหรือสูบบุหรี่เป็นครั้งคราว</option>
                <option value="สูบ/ดื่มประจำ">สูบบุหรี่หรือดื่มสุราเป็นประจำ</option>
            </select>
        </div>
        <div class="form-group">
            <label for="literacy">ความรอบรู้ทางสุขภาพ (Health Literacy):</label>
            <select id="literacy" required>
                <option value="สูง">เข้าใจและนำข้อมูลสุขภาพไปปรับใช้ได้ถูกต้อง</option>
                <option value="ปานกลาง">เข้าใจข้อมูลสุขภาพแต่ยังปรับใช้ได้ไม่ครบถ้วน</option>
                <option value="น้อย">ต้องการการแนะนำจากเจ้าหน้าที่เพิ่มเติม</option>
            </select>
        </div>
        <button type="submit" id="submitBtn">ส่งแบบประเมิน</button>
    </form>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwVEwqZ2mG-hGpbKueV_5zPdBITY4_W2TOEgsrG0h_YSgg1gAb9S4QnkdroFmqpMkRi5A/exec";

    document.getElementById('healthForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "กำลังบันทึกข้อมูล...";

        const payload = {
            fullName: document.getElementById('fullName').value,
            age: document.getElementById('age').value,
            gender: document.getElementById('gender').value,
            nutrition: document.getElementById('nutrition').value,
            exercise: document.getElementById('exercise').value,
            emotion: document.getElementById('emotion').value,
            smoking_alcohol: document.getElementById('smoking_alcohol').value,
            literacy: document.getElementById('literacy').value
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            alert('บันทึกข้อมูลแบบประเมินเรียบร้อยแล้ว ขอบคุณครับ');
            document.getElementById('healthForm').reset();
            submitBtn.disabled = false;
            submitBtn.innerText = "ส่งแบบประเมิน";
        })
        .catch(error => {
            alert('เกิดข้อผิดพลาดในการส่งข้อมูล');
            console.error('Error:', error);
            submitBtn.disabled = false;
            submitBtn.innerText = "ส่งแบบประเมิน";
        });
    });
</script>

</body>
</html>
